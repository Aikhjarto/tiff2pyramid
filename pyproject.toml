[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiff2pyramid"
dynamic = ["version"]
description = "Convert TIFFs into JPEG-compressed pyramidal BigTIFFs for IIPImage (iipsrv)"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Wagner", email = "wagner-thomas@gmx.at" }]
requires-python = ">=3.8"
dependencies = ["pyvips>=2.2"]
keywords = ["tiff", "pyramid", "iipimage", "iiif", "openseadragon", "libvips", "panorama"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.urls]
Homepage = "https://github.com/Aikhjarto/tiff2pyramid"

[project.scripts]
tiff2pyramid = "tiff2pyramid:main"

[tool.setuptools]
py-modules = ["tiff2pyramid"]

[tool.setuptools.dynamic]
version = { attr = "tiff2pyramid.__version__" }
