[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiff2pyramid"
dynamic = ["version"]
description = "Convert TIFFs and Microsoft ICE Deep Zoom exports into JPEG-compressed pyramidal BigTIFFs for IIPImage (iipsrv)"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Wagner", email = "wagner-thomas@gmx.at" }]
requires-python = ">=3.8"
# libvips itself is a system library: install it with the OS package manager,
# or use the "binary" extra, which brings a prebuilt libvips (Windows, macOS, Linux)
dependencies = ["pyvips>=2.2"]
keywords = ["tiff", "pyramid", "iipimage", "iiif", "openseadragon", "libvips", "panorama", "deepzoom", "ice"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
binary = ["pyvips[binary]"]

[project.urls]
Homepage = "https://github.com/Aikhjarto/tiff2pyramid"

[project.scripts]
tiff2pyramid = "tiff2pyramid:main"
ICE2pyramid = "ice2pyramid:main"

[tool.setuptools]
py-modules = ["tiff2pyramid", "ice2pyramid"]

[tool.setuptools.dynamic]
version = { attr = "tiff2pyramid.__version__" }
